version: 2
updates:
  # Actions are pinned by SHA; Dependabot proposes the new SHA
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # Major bumps (e.g. Spring Boot 4) are planned migrations, not automatic PRs
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Updates digest-pinned base images (stay on Java 17 LTS)
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: terraform
    directory: /infra/terraform/local
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /infra/terraform/aws
    schedule: { interval: weekly }
