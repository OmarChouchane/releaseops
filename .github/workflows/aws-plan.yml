name: aws-plan (optional, manual)

# Optional, manual: terraform plan only (never apply) via GitHub OIDC. Setup: infra/terraform/aws/README.md

on:
  workflow_dispatch:

permissions: {}

jobs:
  plan:
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # OIDC token exchange for the AWS role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
          role-session-name: releaseops-plan
      - run: |
          terraform -chdir=infra/terraform/aws init -input=false
          terraform -chdir=infra/terraform/aws plan -input=false -lock=false
