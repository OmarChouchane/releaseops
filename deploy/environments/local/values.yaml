# Desired state of the "local" environment (kind). Argo CD reads this file from Git.
# `image.*` is written by the release process (`./run.sh deploy` locally, the CI release PR
# for GHCR images). Do not edit image.digest by hand.

replicaCount: 2

image:
  repository: ghcr.io/omarchouchane/releaseops-app
  digest: sha256:f2915c1fd00dfe4e40817b212af32d1c6bf2e2071675b3340a62fc433134cd12

service:
  type: NodePort
  nodePort: 30080

secret:
  # Created by Terraform (infra/terraform/local) - the value never touches Git.
  existingSecret: releaseops-db
  create: false

mysql:
  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard

monitoring:
  enabled: true
