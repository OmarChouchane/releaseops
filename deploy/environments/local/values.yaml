# Desired state of the local (kind) environment, read by Argo CD from Git.
# image.* is written by the release process; do not edit image.digest by hand.

replicaCount: 2

image:
  repository: ghcr.io/omarchouchane/releaseops-app
  digest: sha256:30cc75ef85c8f1d757d4821c5b1ba6ae8bace8d765769bb9a61d3aefca6ccc9f

service:
  type: NodePort
  nodePort: 30080

secret:
  # Created by Terraform, never in Git
  existingSecret: releaseops-db
  create: false

mysql:
  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard

monitoring:
  enabled: true
