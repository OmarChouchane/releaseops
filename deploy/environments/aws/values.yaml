# Same chart as local with AWS settings. Unprovisioned/untested: see infra/terraform/environments/aws/README.md

replicaCount: 2

image:
  # From the ecr_repository_url output; the digest is written by the release process
  repository: 000000000000.dkr.ecr.eu-central-1.amazonaws.com/releaseops/app
  digest: ""

service:
  type: ClusterIP # expose through your ingress / ALB controller of choice

secret:
  existingSecret: releaseops-db # create it with External Secrets / Secrets Manager, never in Git
  create: false

mysql:
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "" # cluster default (EBS CSI)
  # For production prefer RDS: mysql.enabled=false, config.database.host=<endpoint>

monitoring:
  enabled: false # enable once a Prometheus Operator stack is installed
