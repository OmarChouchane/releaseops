# Safe, environment-neutral defaults; environments: deploy/environments/<env>/values.yaml

replicaCount: 2

image:
  repository: ghcr.io/CHANGE_ME/releaseops-app
  # Immutable reference, written by CI or ./run.sh release, never by hand
  digest: ""
  # Ad-hoc installs only; ignored when digest is set
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  nodePort: null
  # Actuator is served here, not through the Service
  managementPort: 8081

config:
  applicationName: app
  database:
    name: challenge
    # Empty = in-chart MySQL; set for an external database
    host: ""
  # Extra environment variables (ConfigMap)
  extra: {}

secret:
  # Existing Secret with mysql-user, mysql-password, mysql-root-password (Terraform creates it)
  existingSecret: ""
  # helm install convenience: random credentials, never in Git
  create: true
  username: app

resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 512Mi }

# Rollout failure is reported after this many seconds without progress
progressDeadlineSeconds: 180
terminationGracePeriodSeconds: 40
preStopSleepSeconds: 5

probes:
  # startupProbe 36 x 5s = 180s for JVM boot + Flyway
  startupFailureThreshold: 36

mysql:
  enabled: true
  image:
    repository: docker.io/library/mysql
    # mysql:8.4 LTS, never latest
    digest: sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
  # Small memory footprint for laptops
  args: ["--mysqlx=OFF", "--performance-schema=OFF"]
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

networkPolicy:
  enabled: true

monitoring:
  # Needs the Prometheus Operator CRDs
  enabled: true
  scrapeInterval: 15s
  alertFor: 2m
  dashboard:
    enabled: true
