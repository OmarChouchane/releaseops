apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "releaseops.name" . }}
  labels: {{- include "releaseops.labels" . | nindent 4 }}
# The workloads never talk to the Kubernetes API, so no token is mounted.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "releaseops.mysqlName" . }}
  labels: {{- include "releaseops.labels" . | nindent 4 }}
automountServiceAccountToken: false
