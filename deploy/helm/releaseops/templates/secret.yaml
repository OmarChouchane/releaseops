{{- /*
  Only for a standalone `helm install` without an external secret. Generated values are kept
  across upgrades via lookup. In the GitOps setup secret.existingSecret is used instead
  (Terraform creates it), so no credential appears in Git or in rendered manifests.
*/ -}}
{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- $name := include "releaseops.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "releaseops.labels" . | nindent 4 }}
type: Opaque
data:
  mysql-user: {{ .Values.secret.username | b64enc | quote }}
  {{- if $existing }}
  mysql-password: {{ index $existing.data "mysql-password" | quote }}
  mysql-root-password: {{ index $existing.data "mysql-root-password" | quote }}
  {{- else }}
  mysql-password: {{ randAlphaNum 24 | b64enc | quote }}
  mysql-root-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
