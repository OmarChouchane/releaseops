{{- if and .Values.networkPolicy.enabled .Values.mysql.enabled }}
# Only the application pods may open connections to MySQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "releaseops.mysqlName" . }}
  labels: {{- include "releaseops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "releaseops.mysqlSelectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "releaseops.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3306
{{- end }}
