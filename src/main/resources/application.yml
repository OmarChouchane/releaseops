spring:
  application:
    name: ${SPRING_APPLICATION_NAME:app}
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/challenge?createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Fail fast: metric scrapes and readiness checks must not hang for Hikari's 30s default.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  flyway:
    url: ${SPRING_DATASOURCE_WRITER_URL:jdbc:mysql://localhost:3306/challenge?createDatabaseIfNotExist=true}
    user: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}
    enabled: true
    # MySQL and the app usually start together; wait for the database instead of crashing.
    # (~2.5 min of backoff: 1s,2s,4s then 5s steps - MySQL needs ~90s to initialise a fresh data
    # directory; the Kubernetes startupProbe allows 180s.) Anything longer is a real failure.
    connect-retries: ${FLYWAY_CONNECT_RETRIES:30}
    connect-retries-interval: ${FLYWAY_CONNECT_RETRIES_INTERVAL:5s}
  lifecycle:
    # Upper bound for in-flight requests to finish during SIGTERM.
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:25s}

server:
  # Stop accepting new connections, let in-flight requests complete.
  shutdown: graceful

management:
  # By default the management endpoints stay on the application port (the original behaviour).
  # In Kubernetes the chart sets MANAGEMENT_SERVER_PORT=8081 so actuator is not reachable
  # through the public Service.
  server:
    port: ${MANAGEMENT_SERVER_PORT:}
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,prometheus}
  endpoint:
    health:
      # Enables /actuator/health/liveness and /actuator/health/readiness
      probes:
        enabled: true
      # Show component *names and status* (e.g. db: UP) but never connection details.
      show-components: always
      show-details: never
      group:
        # Liveness must NOT depend on MySQL, otherwise a database blip restarts every pod.
        liveness:
          include: livenessState
        # Readiness does depend on MySQL: no database, no traffic (but no restart either).
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  info:
    build:
      enabled: true
