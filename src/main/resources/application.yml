spring:
  application:
    name: ${SPRING_APPLICATION_NAME:app}
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/challenge?createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Fail fast: no 30s Hikari hang for scrapes and readiness
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  flyway:
    url: ${SPRING_DATASOURCE_WRITER_URL:jdbc:mysql://localhost:3306/challenge?createDatabaseIfNotExist=true}
    user: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}
    enabled: true
    # Wait for MySQL instead of crashing (~2.5 min backoff; a fresh volume needs ~90s)
    connect-retries: ${FLYWAY_CONNECT_RETRIES:30}
    connect-retries-interval: ${FLYWAY_CONNECT_RETRIES_INTERVAL:5s}
  lifecycle:
    # Upper bound for in-flight requests during SIGTERM
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:25s}

server:
  # Stop accepting new connections, let in-flight requests complete.
  shutdown: graceful

management:
  # Management endpoints stay on the app port; the chart sets MANAGEMENT_SERVER_PORT=8081
  server:
    port: ${MANAGEMENT_SERVER_PORT:}
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,prometheus}
  endpoint:
    health:
      # Enables /actuator/health/liveness and /actuator/health/readiness
      probes:
        enabled: true
      # Show component names and status, never connection details
      show-components: always
      show-details: never
      group:
        # Liveness must NOT depend on MySQL, otherwise a database blip restarts every pod.
        liveness:
          include: livenessState
        # Readiness does depend on MySQL: no database, no traffic (but no restart either).
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  info:
    build:
      enabled: true
